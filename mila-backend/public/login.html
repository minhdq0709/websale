<!DOCTYPE html>
<html class="light" lang="vi">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Đăng Nhập / Đăng Ký | Ong Mật Market</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#154212",
            "secondary": "#006e1c",
            "surface": "#f8f9fa",
            "surface-container-lowest": "#ffffff",
            "outline-variant": "#c2c9bb",
            "on-surface-variant": "#42493e",
            "on-primary": "#ffffff",
            "error": "#ba1a1a"
          },
          fontFamily: {
            "body-md": ["Be Vietnam Pro"],
            "label-md": ["Be Vietnam Pro"],
            "headline-md": ["Be Vietnam Pro"]
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .active-tab {
      color: #154212;
      border-bottom: 2px solid #154212;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 1.5rem;
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body class="bg-cover bg-center bg-no-repeat min-h-screen flex items-center justify-center p-4"
  style="background-image: url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1920&q=80');">

  <!-- Lớp phủ tối nhẹ giúp form nổi bật -->
  <div class="absolute inset-0 bg-black/30 backdrop-blur-[1px]"></div>

  <!-- Form container ở giữa màn hình -->
  <main class="relative z-10 w-full max-w-md glass-card p-8 md:p-10 transition-all duration-300">
    <!-- Logo / Tiêu đề -->
    <div class="text-center mb-8">
      <div class="text-primary font-bold text-headline-md font-headline-md tracking-tight cursor-pointer"
        onclick="window.location.href='/index.html'">Ong Mật Market</div>
      <p class="text-on-surface-variant font-body-md text-body-md mt-2">Chào mừng bạn đến với cộng đồng sống sạch.</p>
    </div>

    <!-- Tabs Đăng nhập / Đăng ký -->
    <div class="flex gap-8 border-b border-outline-variant mb-6 justify-center">
      <a class="pb-3 text-label-md font-label-md transition-all active-tab cursor-pointer" id="tab-login"
        href="/login.html">Đăng nhập</a>
      <a class="pb-3 text-label-md font-label-md text-on-surface-variant hover:text-primary transition-all cursor-pointer"
        id="tab-signup" href="/register.html">Đăng ký</a>
    </div>

    <!-- Form Login -->
    <div id="form-login">
      <form class="space-y-5" id="login-form">
        <div>
          <label class="block text-label-sm font-label-sm text-on-surface-variant mb-1">Email hoặc Số điện thoại</label>
          <input id="login-username"
            class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface/60 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md"
            placeholder="user@example.com hoặc 0901234567" type="text" required />
        </div>
        <div>
          <label class="block text-label-sm font-label-sm text-on-surface-variant mb-1">Mật khẩu</label>
          <div class="relative">
            <input id="login-password"
              class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface/60 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md"
              placeholder="••••••••" type="password" required />
            <button id="login-toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline"
              type="button">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox" />
            <span class="text-label-sm font-label-sm text-on-surface-variant">Ghi nhớ đăng nhập</span>
          </label>
          <a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Quên mật khẩu?</a>
        </div>
        <button type="submit"
          class="w-full py-3.5 bg-primary text-on-primary font-label-md text-label-md rounded-xl hover:bg-primary-container hover:scale-[1.01] transition-all duration-200 shadow-md">
          Đăng nhập
        </button>
        <p class="text-center text-body-sm text-on-surface-variant mt-4">
          Chưa có tài khoản? <a class="text-primary font-bold hover:underline" href="/register.html">Đăng ký ngay</a>
        </p>
      </form>
    </div>

    <!-- Footer nhỏ -->
    <div class="mt-8 text-center">
      <p class="text-body-sm font-body-sm text-outline">
        © 2026 Ong Mật Store. Nông sản tươi sạch tại Việt Nam.
      </p>
    </div>
  </main>

  <script src="/js/api.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/login.js" defer></script>
</body>

</html>
